[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camafloodcast"
version = "1.0"
description = "CaMa_Floodcast - desktop application for the CaMa-Flood global river model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

# The core SDK needs only numpy. Everything else is optional, so the library stays usable
# headless in a notebook or in CI without pulling in Qt.
#
# PyQt6-WebEngine is a separate distribution from PyQt6 itself, and is what the map's Leaflet
# basemap (ui.map.leaflet) needs -- listed here so a plain "pip install -e .[gui]" gets it, but
# genuinely optional: its absence is detected at runtime (HAS_LEAFLET_MAP) and every map tab
# falls back to the native Qt renderer (no basemap, but no missing dependency either).
[project.optional-dependencies]
gui = ["PyQt6>=6.5", "PyQt6-WebEngine>=6.5", "pyqtgraph>=0.13", "matplotlib>=3.7"]
geo = ["rasterio>=1.3", "pyproj>=3.5", "shapely>=2.0"]
netcdf = ["xarray>=2023.1", "netCDF4>=1.6"]
# ERA5-Land (via CDS) / GLDAS (via NASA Earthdata) / either one again via Google Earth Engine --
# needs the netcdf extra too (a download is converted through the same netCDF pipeline as a
# manually-fetched file) and the geo extra for the Earth Engine paths (their GeoTIFF response is
# read with rasterio). Credentials are never stored by this app: cdsapi reads ~/.cdsapirc,
# earthaccess reads ~/.netrc, and earthengine-api reads ~/.config/earthengine/credentials,
# exactly as they would for any other use of those libraries.
download = ["cdsapi>=0.7", "earthaccess>=0.9", "earthengine-api>=1.0"]
data = ["pandas>=2.0", "openpyxl>=3.1"]
dev = ["pytest>=7.4", "pytest-qt>=4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["camafloodcast*"]

# The application icon (rendered by packaging/make_icon.py), loaded at startup by ui/app.py.
[tool.setuptools.package-data]
camafloodcast = ["resources/*.ico", "resources/*.png"]
